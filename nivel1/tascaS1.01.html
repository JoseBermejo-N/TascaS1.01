<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TascaS1.01</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BLOQUE 1: Cabecera + Banner -->
  <div class="bloque-superior contenedor">
    <header class="header">
      <div class="logo">.logo</div>
       <nav class="nav-contenedor">
           <a href="#" class="nav">.nav</a>
       </nav> 
      <div class="social">.social</div>
    </header>

    <section class="banner-wrapper">
      <div class="banner">.banner</div>
    </section>
  </div>

  <!-- BLOQUE 2: Sección Central -->
  <div class="bloque-central contenedor">
    <main class="main-content">
      
      <!-- Columna Izquierda -->
      <section class="seccion-articulos">
        <div class="grid-articulos">
          <article class="article">.article</article>
          <article class="article">.article</article>
          <article class="article">.article</article>
          <article class="article">.article</article>
        </div>
        <div class="navegacion">.navegacion</div>
      </section>

      <!-- Columna Derecha -->
      <aside class="sidebar">
        <div class="publicidad">.publicidad</div>
        <div class="publicidad">.publicidad</div>
      </aside>

    </main>
  </div>

  <!-- BLOQUE 3: Pie de página -->
  <div class="bloque-inferior contenedor">
    <footer class="pie">.pie</footer>
  </div>

</body>
</html>
